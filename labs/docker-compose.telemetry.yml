version: '3.8'

services:
  mock-leaf1:
    build:
      context: ./06-gnmi-mock
      dockerfile: Dockerfile
    container_name: aidc-mock-leaf1
    ports:
      - "9339:9339"
    restart: unless-stopped
    command: ["./mock-leaf", "-serve", "-addr", ":9339", "-speed", "1"]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aidc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=2h'
    depends_on:
      - mock-leaf1
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: aidc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
