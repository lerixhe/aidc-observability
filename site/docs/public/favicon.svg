<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="智算网络可观测指南">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 底：站点强调色（青 → 紫）圆角方块 -->
  <rect width="64" height="64" rx="15" fill="url(#lp-bg)"/>
  <!-- 形：一条遥测脉冲（圆头端点即路径两端的两个节点） -->
  <path d="M15 33h6l4-12 6 25 6-19 4 6h8"
        fill="none" stroke="#fff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
